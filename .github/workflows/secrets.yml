# Fails if a commit adds an API key or a .env file. Runs on every push and pull request
# (also from forks: it needs no secrets). Manual runs scan the whole history.
# Uses only the Python standard library: scripts/check_secrets.py prints file:line, never values.
name: secrets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the commit range needs history
          persist-credentials: false

      - name: Scan the tracked files
        run: python3 scripts/check_secrets.py

      - name: Scan the pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # New branch or force push: scan every commit reachable from it.
            python3 scripts/check_secrets.py --range "$AFTER"
          else
            python3 scripts/check_secrets.py --range "$BEFORE..$AFTER"
          fi

      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check_secrets.py --range "$BASE..$HEAD"

      - name: Scan the whole history
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/check_secrets.py --history
